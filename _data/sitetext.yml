# Spanish
# -------
es: &DEFAULT_ES
  header:
    title: ¡Bienvenido a Seth&Nut!
    text: Investigación en Educación y Tecnología
    button: Ver más
    buttonlink: "#servicios"

  services:
    title: "Servicios"
    text: ""
    section: servicios
    list:
      - title: "Investigación en Educación y Tecnología"
        desc: "Desarrollamos y presentamos investigaciones en congresos nacionales e internacionales, abordando la enseñanza de la matemática, la programación y la ciencia de datos."
        icon: fas fa-microscope
      - title: "Colaboración Académica y Proyectos Educativos"
        desc: "Participamos en iniciativas colaborativas con universidades, contribuyendo al diseño, análisis y desarrollo de herramientas y metodologías para la educación superior."
        icon: fas fa-university
      - title: "Charlas y Talleres Universitarios"
        desc: "Realizamos charlas y talleres en instituciones de educación superior, orientados a la divulgación científica, la innovación docente y el uso de tecnologías abiertas."
        icon: fas fa-chalkboard-teacher


  portfolio:
    title: "Portafolio"
    text: "Relacionandos con nuestra comunidad"
    section: portafolio
    closebutton: "Cerrar Proyecto"

  timeline:
    title: "Cronología"
    text: "Nuestra Historia"
    section: cronologia
    # left is the default
    #start_align: "left"
    events:
      - title: "Nuestra Formación en Ingeniería"
        year: "2011-2017"
        desc: "Entre 2011 y 2017, nos formamos en ingeniería en instituciones líderes (UTFSM y PUCV), descubriendo nuestra pasión por la enseñanza como ayudantes en cursos de matemáticas y programación."
        image: assets/img/timeline/5.jpg
        alt: Formación en ingeniería

      - title: "Nuestra Experiencia Profesional"
        year: "2018-2023"
        desc: "Entre 2018 y 2022, combinamos nuestra experiencia en la industria con la enseñanza en universidades y bootcamps, adquiriendo conocimientos prácticos y desarrollando una visión integral como docentes, dentro y fuera del ámbito educativo."
        image: assets/img/timeline/3.jpg
        alt: Experiencia en programación y enseñanza

      - title: "Participación en Iniciativas Comunitarias"
        year: "2022-2023"
        desc: "En 2022 y 2023, participamos en charlas y talleres organizados por universidades y entidades sin fines de lucro, promoviendo el acceso al conocimiento en programación y matemáticas de forma voluntaria." 
        image: assets/img/timeline/11.jpg
        alt: Charlas y talleres comunitarios

      - title: "Alianza Estratégica y Expansión"
        year: "2023-2024"
        desc: "En 2023-2024, nos aliamos con DUOC UC para ofrecer talleres y cursos, ampliando nuestro alcance y fortaleciendo nuestro compromiso con la educación accesible y de calidad."
        image: assets/img/timeline/10.jpg
        alt: Alianza con DUOC UC

      - title: "Participación en Congresos"
        year: "2024-2025"
        desc: "Entre 2024 y 2025, nos enfocamos en el desarrollo y presentación de investigaciones en congresos nacionales e internacionales sobre educación matemática, programación y ciencia de datos."
        image: assets/img/timeline/14.png
        alt: Participación en congresos académicos
        
        # you can enforce the alignment
        end: "¡Únete <br> a Nuestra <br> Misión!"

  about:
    title: "Sobre Nosotros"
    text: ""
    body: "Seth&Nut es una iniciativa académica orientada al desarrollo de investigación educativa, colaboración interuniversitaria y divulgación científica en matemática, programación y ciencia de datos. Nuestro trabajo se centra en la participación en congresos nacionales e internacionales, la colaboración con proyectos educativos y la realización de charlas y talleres en universidades. Creemos que la investigación, las tecnologías abiertas y la colaboración académica son claves para fortalecer la educación superior y generar un impacto formativo sostenible."
    section: nosotros

  clients:
